<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Lia</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #120d1d;
            color: #f8e9ff;
            padding: 32px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #ffd8ea;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th, .table td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: bold;
            background: rgba(255,255,255,0.08);
        }
        .badge.yes {
            background: rgba(255, 126, 182, 0.2);
            color: #ffc9e2;
        }
        .badge.no {
            background: rgba(156, 124, 255, 0.2);
            color: #d9c8ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Respuestas de Lia</h1>
        <table class="table">
            <thead>
                <tr>
                    <th>Respuesta</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody id="responses-list"></tbody>
        </table>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
